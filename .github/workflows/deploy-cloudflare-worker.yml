name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - cloudflare-workers-deploy
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Test worker
        run: npm test
        working-directory: worker

      - name: Build worker
        run: npm run build
        working-directory: worker

      - name: Smoke load worker locally
        run: |
          set -euo pipefail

          load_port=18787
          PORT="$load_port" npm run load:local-server > /tmp/dailyreview-load-server.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          check_health() {
            local health
            health="$(curl -fsS "http://127.0.0.1:${load_port}/api/health" 2>/dev/null || true)"
            node -e "const h = JSON.parse(process.argv[1] || '{}'); if (h.status !== 'ok' || h.runtime !== 'cloudflare-workers') process.exit(1);" "$health" 2>/dev/null
          }

          for attempt in {1..30}; do
            if check_health; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/dailyreview-load-server.log
              exit 1
            fi
            sleep 1
          done

          check_health || {
            cat /tmp/dailyreview-load-server.log
            exit 1
          }

          DAILYREVIEW_BASE_URL="http://127.0.0.1:${load_port}" \
          ADMIN_EMAIL=admin@example.com \
          ADMIN_INITIAL_PASSWORD=admin-password \
          DAILYREVIEW_LOAD_DURATION_MS=15000 \
          npm run load
        working-directory: worker

      - name: Apply D1 migrations
        run: |
          set +e
          migration_output="$(npx wrangler d1 migrations apply dailyreview-prod --remote 2>&1)"
          migration_status=$?
          set -e

          printf '%s\n' "$migration_output"
          if [ "$migration_status" -eq 0 ]; then
            exit 0
          fi

          if printf '%s' "$migration_output" | grep -Eqi 'authentication|unauthorized|not authorized|permission|forbidden|code: (10000|9109)'; then
            printf '::error title=D1 migration failed::diagnostic=d1_auth_or_permission\n'
          elif printf '%s' "$migration_output" | grep -Eqi 'duplicate column|already exists|unique constraint failed'; then
            printf '::error title=D1 migration failed::diagnostic=d1_schema_conflict\n'
          elif printf '%s' "$migration_output" | grep -Eqi 'no migrations|migration.*not found|no such table'; then
            printf '::error title=D1 migration failed::diagnostic=d1_migration_state\n'
          else
            printf '::error title=D1 migration failed::diagnostic=d1_unknown\n'
          fi
          exit "$migration_status"
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy worker
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
