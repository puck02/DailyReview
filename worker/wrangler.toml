name = "dailyreview"
main = "src/index.ts"
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
workers_dev = true
preview_urls = true
keep_vars = true
routes = [
  { pattern = "nektos.cn", custom_domain = true, enabled = true, previews_enabled = false }
]

[observability]
enabled = true
head_sampling_rate = 0.1

[assets]
directory = "../frontend/dist"
binding = "ASSETS"

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "dailyreview-prod"
database_id = "a7ec6d1f-a140-4714-bf21-0c7ba6b77625"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dailyreview-prod-assets"

[[durable_objects.bindings]]
name = "REPORT_SCHEDULER"
class_name = "ReportScheduler"

[[migrations]]
tag = "v1_report_scheduler"
new_sqlite_classes = ["ReportScheduler"]

[triggers]
crons = ["0 * * * *", "*/10 * * * *"]

[vars]
APP_TIMEZONE = "Asia/Shanghai"
MAX_UPLOAD_BYTES = "10485760"
